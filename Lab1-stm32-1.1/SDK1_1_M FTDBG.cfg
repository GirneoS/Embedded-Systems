source [find SDK11M_FT.cfg]
set WORKAREASIZE 0x8000
transport select jtag
set CHIPNAME STM32F427VITx
set BOARDNAME SDK1_1_M
# The ST target script uses CLOCK_FREQ (kHz), including after reset-init.
# Stay below the safe JTAG rate while the MCU runs from its reset HSI clock.
set CLOCK_FREQ 1000
reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
source [find target/stm32f4x.cfg]

# STM32F427 has the ARM debug TAP (IR=4) and the ST boundary-scan TAP (IR=5).
# The STM32CubeIDE 2022 target script only declares the first one. Declare
# the second before init instead of leaving it as an automatically found TAP.
# Newer OpenOCD target scripts already declare this TAP.
if {[lsearch -exact [jtag names] "${CHIPNAME}.bs"] < 0} {
    jtag newtap $CHIPNAME bs -irlen 5 -expected-id 0x06419041
}
